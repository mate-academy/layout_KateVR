<!doctype html>
<html
  lang="en"
  class="order-page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>KatVR</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./images/favicon.svg"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>

  <body class="order-page__body">
    <div class="order-complete">
      <div class="container">
        <div class="order__top order-complete__top">
          <a
            href="./index.html"
            class="logo order__logo"
          >
            <img
              src="./images/logo.svg"
              alt="logo"
              class="logo__img"
            />
          </a>
          <a
            href="./order.html"
            class="order__top-link"
          >
            Place Order
          </a>
          <a
            href="./pay.html"
            class="order__top-link"
          >
            Pay
          </a>
          <a
            href="./complete.html"
            class="order__top-link order__top-link--active"
          >
            Order complete
          </a>
          <a
            href="./index.html"
            class="order__close-btn"
          ></a>
        </div>
        <div class="order-complete__bottom">
          <h2 class="order-complete__title">
            Thank You For
            <span class="order-complete__span">Your</span>
            Order
          </h2>
          <p class="order-complete__description">
            Your order has been placed and is being processed. You will recive
            an email with the order details
          </p>
          <a
            href="./index.html"
            class="order-complete__btn button"
          >
            Back to homepage
          </a>
        </div>
      </div>
    </div>
    <script src="./scripts/order.js"></script>
  </body>
</html>
